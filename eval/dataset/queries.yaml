    query: "kubernetes deployment strategy"
    relevant: {}
    forbidden: []
    note: >-
      Nothing in the corpus answers this. Included because returning confident
      nonsense for an unanswerable question is a real failure mode, and a corpus
      where every query has an answer never tests for it.
