# Graded relevance judgments.
#
# grade 2 = directly answers the question
# grade 1 = useful context a good result set would include
# absent   = irrelevant
#
# `forbidden` lists memories that must NEVER appear in the top k. These are
# almost all superseded facts, and they are the point of the whole exercise: a
# retired memory usually matches the query wording better than its replacement,
# so a similarity-only system ranks it first. stale_inclusion_rate must be 0.
#
# Judgments were written before any metric was run. Writing them afterwards
# would mean grading whatever the system happened to return.

queries:
  # --- the running example ------------------------------------------------
  - id: q01
    query: "what queue does this project use"
    relevant: {m102: 2, m103: 1, m104: 1}
    forbidden: [m101]

  - id: q02
    query: "redis"
    relevant: {m102: 2}
    forbidden: [m101]
    note: >-
      The hardest case. The retired memory is about Redis and mentions it twice;
      the current one mentions it only to say it was removed. Lexical relevance
      alone would rank the retired one first, which is why suppression has to be
      structural rather than a ranking effect.

  - id: q03
    query: "task queue claiming"
    relevant: {m102: 2, m104: 1}
    forbidden: [m101]

  - id: q04
