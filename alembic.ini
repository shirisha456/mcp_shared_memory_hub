[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, ordered, human-readable filenames.
file_template = %%(rev)s_%%(slug)s

# Deliberately empty. The URL comes from memhub.config (or, in tests, from
# config.attributes["db_url"]). Putting it here would duplicate configuration
# and would break on passwords containing '%' via ConfigParser interpolation.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
